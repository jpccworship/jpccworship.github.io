<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scheduling · JPCC Worship People</title>
<meta name="description" content="Menyusun, mengecek & menerbitkan jadwal pelayanan. Khusus tim People JPCC Worship.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/ikon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/ikon-64.png">
<link rel="apple-touch-icon" href="../assets/ikon-180.png">
<link rel="stylesheet" href="../assets/jpcc.css">
<style>
  :root { color-scheme: light; --ink: #1F1B24; --muted: #6B6575; --line: #E7E3EE; --bg: #F7F5FA; --soft: #F3EFF9; --brand: #4B2E83; --brand2: #6A4BB0;
    --ok: #137333; --okbg: #E6F4EA; --bad: #A50E0E; --badbg: #FCE8E6; --warn: #8A5300; --warnbg: #FDF0DC;
    --umum: #4B2E83; --youth: #00695C; --kids: #C0510A; --ease: cubic-bezier(.2, .7, .2, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: var(--brand); font-weight: 700; }
  .kecil { font-size: 12px; color: var(--muted); }
  .tebal { font-weight: 800; }

  /* ---------- kerangka ---------- */
  #app { display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  #atas { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #fff; border-bottom: 1px solid var(--line); }
  #atas .menu { display: none; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; align-items: center; justify-content: center; }
  .eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; color: var(--brand); text-transform: uppercase; }
  .eyebrow span { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 9.5px; letter-spacing: .16em; }
  #atas h1 { font-size: 19px; letter-spacing: -.01em; line-height: 1.15; }
  #atas .sp { flex: 1; }
  .akun { display: flex; align-items: center; gap: 9px; padding: 5px 6px 5px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; }
  .akun b { font-size: 13px; } .akun small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .akun button { height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--soft); color: var(--brand); font-weight: 800; font-size: 12px; }
  #sisi { overflow: auto; background: #fff; border-right: 1px solid var(--line); padding: 12px 10px 20px; }
  #sisi .grp { margin: 14px 10px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: #9A93A6; text-transform: uppercase; }
  #sisi .grp:first-child { margin-top: 4px; }
  #sisi button { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border: 0; border-radius: 11px; background: transparent; text-align: left; font-weight: 700; color: #4A4155; }
  #sisi button:hover { background: var(--soft); }
  #sisi button.on { background: var(--brand); color: #fff; }
  #sisi button svg { flex: none; width: 18px; height: 18px; }
  #sisi button .n { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warnbg); color: var(--warn); font-size: 11.5px; font-weight: 800; line-height: 20px; text-align: center; }
  #sisi button.on .n { background: rgba(255, 255, 255, .22); color: #fff; }
  #sisi .langkah { margin-left: auto; font-size: 10.5px; font-weight: 800; color: #B9B2C6; }
  #sisi button.on .langkah { color: rgba(255, 255, 255, .7); }
  #isi { overflow: auto; padding: 18px 20px 60px; }
  @media (min-width: 901px) { #app.ada-laci #isi { padding-right: 416px; } }
  .lebar { max-width: 1180px; margin: 0 auto; }
  .judul { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .judul h2 { font-size: 22px; letter-spacing: -.015em; }
  .judul p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .judul .sp { flex: 1; }

  /* ---------- komponen ---------- */
  .kartu { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .kartu + .kartu { margin-top: 12px; }
  .kolom2 > .kartu, .kolom3 > .kartu { margin-top: 0; }
  .kartu h3 { font-size: 15px; margin-bottom: 4px; }
  .kartu .ket { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
  .kolom2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .kolom3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border: 0; border-radius: 11px; background: var(--brand); color: #fff; font-weight: 800; white-space: nowrap; }
  .btn:hover { background: #3D2470; }
  .btn.garis { background: #fff; color: var(--brand); border: 1.5px solid #D6CCEB; }
  .btn.garis:hover { background: var(--soft); }
  .btn.bahaya { background: #fff; color: var(--bad); border: 1.5px solid #F0C4BF; }
  .btn.hijau { background: var(--ok); }
  .btn.kcl { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; }
  .btn:disabled { background: #D9D4E2; color: #fff; border-color: transparent; cursor: not-allowed; }
  .btn.garis:disabled { background: #F4F3F6; color: #A9A3B4; border-color: #E7E3EE; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: #ECE8F3; gap: 2px; }
  .seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; font-weight: 800; color: #5B5368; display: inline-flex; align-items: center; gap: 6px; }
  .seg button.on { background: #fff; color: var(--brand); box-shadow: 0 1px 3px rgba(31, 27, 36, .14); }
  .seg button .ttk { width: 8px; height: 8px; border-radius: 50%; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--soft); color: #4A4155; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: var(--okbg); color: #0B5A2A; } .chip.bad { background: var(--badbg); color: var(--bad); } .chip.warn { background: var(--warnbg); color: var(--warn); }
  .chip.trn { background: #D6F1EA; color: #0A5C50; }
  .chip.ungu { background: #EDE4FB; color: var(--brand); } .chip.kuning { background: #FFF3B8; color: #6B5300; } .chip.abu { background: #EEECF1; color: #6B6575; }
  .chip.Umum { background: #EDE4FB; color: var(--umum); } .chip.Youth { background: #DDF1EE; color: var(--youth); } .chip.Kids { background: #FBE6D8; color: var(--kids); }
  .isian { height: 40px; border: 1.5px solid #CFC7DD; border-radius: 11px; padding: 0 12px; background: #fff; outline: none; min-width: 0; }
  textarea.isian { height: auto; padding: 10px 12px; line-height: 1.5; resize: vertical; width: 100%; }
  .isian:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(75, 46, 131, .12); }
  .lbl { display: block; font-size: 12px; font-weight: 800; color: #4A4155; margin: 0 0 5px; }
  .bidang { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bidang .penuh { grid-column: 1 / -1; }
  .bidang .isian, .bidang select { width: 100%; }
  .alat { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .alat .sp { flex: 1; }
  .pesan { border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; background: var(--soft); color: #4A4155; }
  .pesan.ok { background: var(--okbg); color: #0B5A2A; } .pesan.warn { background: var(--warnbg); color: var(--warn); } .pesan.bad { background: var(--badbg); color: var(--bad); }
  .kosong { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13.5px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; background: #fff; position: sticky; top: 0; z-index: 1; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid #F1EEF5; vertical-align: top; }
  table.t tr.klik { cursor: pointer; } table.t tr.klik:hover td { background: #FBF9FE; }
  .tw { overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .bar { height: 8px; border-radius: 999px; background: #ECE8F3; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
  .ava { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; background: var(--brand); }
  .tab2 { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 14px; overflow: auto; }
  .tab2 button { height: 40px; padding: 0 14px; border: 0; background: transparent; font-weight: 800; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
  .tab2 button.on { color: var(--brand); border-bottom-color: var(--brand); }

  /* ---------- beranda ---------- */
  .siklus { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin-top: 12px; position: relative; }
  .siklus .th { position: relative; padding: 0 8px; text-align: center; }
  .siklus .th::before { content: ''; position: absolute; left: -50%; right: 50%; top: 13px; height: 4px; background: #E7E3EE; }
  .siklus .th:first-child::before { display: none; }
  .siklus .th.lewat::before, .siklus .th.kini::before { background: var(--brand); }
  .siklus .bul { position: relative; z-index: 1; width: 30px; height: 30px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 3px solid #D9D2E6; font-size: 12px; font-weight: 800; color: #9A93A6; }
  .siklus .th.lewat .bul { background: var(--brand); border-color: var(--brand); color: #fff; }
  .siklus .th.kini .bul { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 5px rgba(75, 46, 131, .14); }
  .siklus b { display: block; font-size: 13px; line-height: 1.3; } .siklus small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mn-kartu { border-top: 4px solid var(--brand); }
  .mn-kartu.Youth { border-top-color: var(--youth); } .mn-kartu.Kids { border-top-color: var(--kids); }
  .mn-kartu .angka { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .daftar { list-style: none; margin: 0; padding: 0; }
  .daftar li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #F1EEF5; }
  .daftar li:first-child { border-top: 0; }
  .daftar li .sp { flex: 1; min-width: 0; }
  .daftar li b { display: block; font-size: 13.5px; } .daftar li small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  button.baris { width: 100%; border: 0; background: transparent; text-align: left; padding: 0; }

  /* ---------- susun ---------- */
  .tgl-bar { display: flex; gap: 6px; overflow: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .tgl-bar button { flex: none; min-width: 64px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; text-align: left; }
  .tgl-bar button b { display: block; font-size: 13px; } .tgl-bar button small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 1px; }
  .tgl-bar button.on { border-color: var(--brand); background: var(--brand); color: #fff; } .tgl-bar button.on small { color: rgba(255, 255, 255, .8); }
  .tgl-bar button .m { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #E0832B; margin-left: 5px; vertical-align: 2px; }
  .gridw { overflow-x: auto; overflow-y: hidden; border: 1px solid var(--line); border-radius: 14px; background: #fff; scrollbar-width: none; }
  .gridw::-webkit-scrollbar { display: none; }
  .geser { position: sticky; bottom: 0; z-index: 6; height: 18px; margin: 4px 0 0; overflow-x: auto; overflow-y: hidden; background: #F1EEF6; border-radius: 9px; box-shadow: 0 -6px 12px rgba(247, 245, 250, .9); }
  .geser i { display: block; height: 1px; }
  @media (pointer: coarse) { .geser { display: none; } }
  table.g { border-collapse: separate; border-spacing: 0; font-size: 12.5px; min-width: 100%; }
  table.g th, table.g td { border-right: 1px solid #EFECF4; border-bottom: 1px solid #EFECF4; }
  table.g thead th { position: relative; z-index: 3; background: #fff; padding: 0; transform: translateY(var(--naik, 0px)); }
  table.g.melayang thead tr.r2 th { box-shadow: 0 6px 14px rgba(31, 27, 36, .12); }
  table.g thead tr.r1 th { background: #2D1863; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .04em; padding: 6px 10px; text-align: left; border-right: 2px solid #fff; }
  table.g th.pr, table.g td.pr { position: sticky; left: 0; z-index: 2; background: #fff; min-width: 132px; max-width: 132px; padding: 0 10px; text-align: left; font-weight: 700; color: #4A4155; border-right: 2px solid #D9D2E6; }
  table.g thead th.pr { position: sticky; z-index: 4; }
  table.g tr.r1 th.pr { background: #2D1863; }
  .sv { display: block; width: 100%; min-width: 150px; padding: 7px 9px 8px; border: 0; background: #fff; text-align: left; font-weight: 400; }
  .sv:hover { background: #FBF9FE; }
  .sv .k { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; }
  .sv .k i { width: 8px; height: 8px; border-radius: 3px; background: var(--brand); }
  .sv small { display: block; color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .sv .cat { display: inline-block; margin-top: 4px; padding: 1px 7px; border-radius: 999px; background: #FFF3B8; color: #6B5300; font-size: 10.5px; font-weight: 800; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sv .se { background: #FBE6D8; color: var(--kids); }
  table.g tr.grp td { background: #F6F3FB; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--brand); text-transform: uppercase; padding: 4px 10px; }
  table.g tr.grp td.pr { background: #F6F3FB; }
  table.g td { padding: 0; height: 34px; }
  .sel { display: flex; align-items: center; gap: 6px; width: 100%; height: 34px; min-width: 150px; padding: 0 9px; border: 0; background: transparent; text-align: left; white-space: nowrap; overflow: hidden; }
  .sel span { overflow: hidden; text-overflow: ellipsis; }
  .sel:hover { background: #F6F3FB; }
  .sel.kosong-wajib { background: repeating-linear-gradient(-45deg, #fff 0 6px, #F6F1FF 6px 12px); color: #9A8BC0; font-weight: 700; font-size: 11.5px; }
  .sel.tak { color: #CFC9DA; }
  /* role Trainee di Database: warna toska + pita miring TRAINEE (hanya di halaman Scheduling, jadwal publik tetap biasa) */
  .sel.trn { position: relative; background: #E0F4EF; color: #0A5C50; font-weight: 700; padding-right: 30px; }
  .sel .rib { position: absolute; right: -20px; bottom: 10px; width: 74px; height: 12px; transform: rotate(-45deg); background: #0F7B6C; color: #fff; font-style: normal; font-size: 6.5px; font-weight: 800; letter-spacing: .04em; line-height: 12px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.2); pointer-events: none; }
  .sel.f-asing, .sel.f-blok { background: var(--badbg); color: var(--bad); font-weight: 700; }
  .sel.f-blok span { text-decoration: line-through; }
  .sel.f-bentrok { background: #FFE3C2; color: #8A3D00; font-weight: 700; }
  .sel.f-turut { background: #EDE4FB; color: var(--brand); font-weight: 700; }
  .sel.f-lebih { background: #FFFBDD; color: #4F4200; }
  .sel.sama { box-shadow: inset 0 0 0 2px #1E88E5; }
  .sel.aktif { box-shadow: inset 0 0 0 2.5px var(--brand); background: #fff; }
  .sel .kh { flex: none; padding: 0 5px; border-radius: 5px; background: #2D1863; color: #fff; font-size: 10px; font-weight: 800; }
  .sel .ub { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #E0832B; }
  .legenda { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
  .masalah { margin-top: 12px; }
  .masalah li button { display: flex; gap: 8px; align-items: flex-start; width: 100%; border: 0; background: transparent; text-align: left; padding: 0; line-height: 1.45; }
  .masalah li button:hover b { text-decoration: underline; }

  /* ---------- laci & modal ---------- */
  #tirai { position: fixed; inset: 0; z-index: 40; background: rgba(31, 27, 36, .42); display: none; }
  #tirai.buka { display: block; }
  #laci { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; background: #fff; box-shadow: -18px 0 50px rgba(31, 27, 36, .18); transform: translateX(105%); transition: transform .22s var(--ease); display: flex; flex-direction: column; }
  #laci.buka { transform: none; }
  #laci .kp { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #laci .kp .x, #modal .x { float: right; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--soft); font-size: 18px; line-height: 1; color: #4A4155; }
  #laci .kp small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--brand); text-transform: uppercase; }
  #laci .kp h3 { font-size: 17px; margin-top: 2px; }
  #laci .bd { flex: 1; overflow: auto; padding: 12px 16px 20px; }
  #laci .kk { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #laci .seg { display: flex; } #laci .seg button { flex: 1; justify-content: center; padding: 0 8px; font-size: 12.5px; white-space: nowrap; }
  #laci .btn.lentur { white-space: normal; height: auto; padding: 9px 12px; text-align: left; line-height: 1.4; }
  .calon { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 9px 10px; margin-bottom: 6px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; text-align: left; }
  .calon:hover { border-color: #B9A5DC; background: #FBF9FE; }
  .calon.pakai { border-color: var(--brand); background: #F3EEFA; }
  .calon .who { flex: 1; min-width: 0; }
  .calon .who b { display: block; font-size: 13.5px; }
  .calon .who small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .calon .tanda { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .calon .ke { flex: none; font-size: 11px; font-weight: 800; color: #B9B2C6; padding-top: 2px; }
  #modal { position: fixed; z-index: 50; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; }
  #modal.buka { display: flex; }
  #modal .kotak { width: 560px; max-width: 100%; max-height: 92vh; overflow: auto; background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 24px 70px rgba(31, 27, 36, .3); }
  #modal h3 { font-size: 18px; margin-bottom: 4px; }
  #modal .ket { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
  #modal .aksi { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  #roti { position: fixed; z-index: 60; left: 50%; bottom: 22px; transform: translate(-50%, 20px); padding: 11px 16px; border-radius: 12px; background: #1F1B24; color: #fff; font-weight: 700; font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s var(--ease); max-width: 92vw; }
  #roti.buka { opacity: 1; transform: translate(-50%, 0); }
  #roti.aksi { display: flex; align-items: center; gap: 12px; }
  .cek-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
  .cek-t b { font-weight: 700; line-height: 1.35; }
  .cek-t small { font-size: 12.5px; font-weight: 600; color: var(--muted); line-height: 1.35; }
  #roti.aksi.buka { pointer-events: auto; }
  #roti .roti-b { flex: none; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: #fff; color: #1F1B24; font-weight: 800; font-size: 12.5px; cursor: pointer; }
  #roti .roti-b:hover { background: #EDE7F6; }
  /* baris tanggal + alat tabel (urungkan, zoom tabel saja) */
  .tgl-baris { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }

<script type="text/plain" id="jpcc-app">
var DATA = window.__DATA__;

(function () {

/* =====================================================================================================

var $ = function (id) { return document.getElementById(id); };
var HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'], HARIP = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

function kn(n) { return String(n == null ? '' : n).replace(/^\s*(TK|UR|SH) ?\d+( ?- ?\d+)? ?:/i, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
function tglObj(t) { return new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, +t.slice(8, 10)); }

var DATA = window.DATA || window.__DATA__ || {};

function kcTeks(v) { var s = String(v || '').toLowerCase(); return /^tk$|kasablanka/.test(s) ? 'TK' : /^ur$|upper/.test(s) ? 'UR' : /^sh$|sutera/.test(s) ? 'SH' : ''; }

function mnSv(sv) { sv = String(sv || ''); return /Kids|LH|KK|CC/.test(sv) ? 'Kids' : /Youth/.test(sv) ? 'Youth' : 'Umum'; }
function mnDariSv(sv) { for (var i = 0; i < MN.length; i++) if (D.atur.pola[MN[i]] && D.atur.pola[MN[i]].sv.indexOf(sv) >= 0) return MN[i]; return mnSv(sv); }

function pisah(v) {
  var s = String(v == null ? '' : v).trim(), m = /^((?:TK|UR|SH) ?\d+(?: ?- ?\d+)?) ?:/i.exec(s);

/* ---------- blockout, cuti peran, aturan pelayan ---------- */
var BL = {}, CP = {}, AT = {};
function muatBL() {
  BL = {}; CP = {}; AT = {};
  D.blockout.forEach(function (b) { if (!/batal/i.test(b[7])) (BL[kn(b[1])] = BL[kn(b[1])] || []).push(b); });

function cutiPada(k, t, label, mn) { var l = CP[k]; if (!l) return null; var g = grupPeran(label); for (var i = 0; i < l.length; i++) if (l[i].a <= t && t <= l[i].b && l[i].per.indexOf(g) >= 0 && (!mn || !l[i].ib || l[i].ib.indexOf(mn) >= 0)) return l[i]; return null; }

/* ---------- kolom draft ---------- */
function reLanjut(c) { return c.jenis === 'Special event' && /hari\s*([2-9]|[1-9]\d)\s*(dari|\/)/i.test(c.cat); }
function siapkanKol(mn, c) {
  var m = c.jenis === 'Special event' ? /hari\s*(\d+)\s*(?:dari|\/)\s*(\d+)/i.exec(c.cat) : null;
  c.g = m ? c.acara + '§' + m[2] : ''; c.hari = m ? +m[1] : 0; c.lanjut = reLanjut(c);

}

  var lama = D.input[mn].kol, bySid = {}, kurang = false;

function tandaiTarik() {

var PL = [];
function muatPilihan() { PL = D.pilihan.lists.map(function (l) { var o = {}; l.forEach(function (i) { o[i] = 1; }); return o; }); }

function layakSel(a, c, i) { var q = c.kd ? c.kd[i] : -1; return q >= 0 && !!PL[q] && !!PL[q][a.idx]; }

  ket.textContent = !a ? 'Pilih nama dulu: pilihan ibadah menyesuaikan ibadah yang dia layani. Semua = berlaku di semua ibadah.' :
    mins.length < 2 ? a.n + ' hanya melayani di ' + mins[0] + ', jadi ' + jenis.toLowerCase() + ' berlaku di ' + mins[0] + '.' :

  if (l.getAttribute('data-untuk') === kunci) return;

  if (lama.length === mins.length) lama = [];

  }).join('');
}
function aturIbBk(t) {
  var kotak = Array.prototype.slice.call(document.querySelectorAll('[name=bkIb]')), semua = kotak[0], lain = kotak.slice(1);
  if (t === semua) { if (semua.checked) lain.forEach(function (x) { x.checked = false; }); else semua.checked = true; }
  else {
    var n = lain.filter(function (x) { return x.checked; }).length;
    if (!n || n === lain.length) { lain.forEach(function (x) { x.checked = false; }); semua.checked = true; } else semua.checked = false;
  }
}
function ibBkDipilih() {
  var kotak = Array.prototype.slice.call(document.querySelectorAll('[name=bkIb]'));
  if (!kotak.length || kotak[0].checked) return [];
  return kotak.slice(1).filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
}
